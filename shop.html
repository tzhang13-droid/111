<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>零食小铺</title>
<style>
  :root {
    --wall: #f6e9dc;
    --wall-2: #efdccb;
    --floor: #d9b896;
    --floor-2: #c9a37e;
    --ink: #3d2b20;
    --accent: #e86a7c;
    --accent-2: #ffb3bf;
    --paper: #fffaf3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #2b211b;
    overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }

  /* 固定 1600×900 舞台，按窗口等比缩放 */
  #viewport { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage {
    position: relative; width: 1600px; height: 900px;
    transform-origin: center center;
    background:
      linear-gradient(to bottom, var(--wall) 0%, var(--wall-2) 66%, var(--floor) 66%, var(--floor-2) 100%);
    overflow: hidden;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  /* 墙面装饰 */
  .wall-stripe {
    position: absolute; left: 0; right: 0; top: 0; height: 70px;
    background: repeating-linear-gradient(90deg, var(--accent-2) 0 60px, #fff 60px 120px);
    clip-path: polygon(0 0,100% 0,100% 60%, 97% 100%, 94% 60%, 91% 100%, 88% 60%, 85% 100%, 82% 60%, 79% 100%, 76% 60%, 73% 100%, 70% 60%, 67% 100%, 64% 60%, 61% 100%, 58% 60%, 55% 100%, 52% 60%, 49% 100%, 46% 60%, 43% 100%, 40% 60%, 37% 100%, 34% 60%, 31% 100%, 28% 60%, 25% 100%, 22% 60%, 19% 100%, 16% 60%, 13% 100%, 10% 60%, 7% 100%, 4% 60%, 1% 100%, 0 60%);
    filter: drop-shadow(0 4px 4px rgba(0,0,0,.08));
  }
  .sign {
    position: absolute; left: 50%; top: 90px; transform: translateX(-50%);
    font-size: 44px; font-weight: 800; letter-spacing: 6px;
    color: var(--accent);
    background: var(--paper); padding: 10px 34px; border-radius: 999px;
    box-shadow: 0 6px 0 #e9cdb8;
  }
  .floor-line {
    position: absolute; left: 0; right: 0; top: 66%; height: 0;
    border-top: 3px solid rgba(0,0,0,.08);
  }
  .floor-tiles {
    position: absolute; left: 0; right: 0; top: 66%; bottom: 0;
    background:
      repeating-linear-gradient(90deg, transparent 0 158px, rgba(0,0,0,.06) 158px 160px);
    opacity: .8;
  }

  img { -webkit-user-drag: none; user-drag: none; pointer-events: none; display: block; }

  /* 货架 */
  #shelf { position: absolute; left: 70px; top: 150px; width: 600px; height: 655px; }
  #shelf > img.shelf-img { width: 100%; height: 100%; filter: drop-shadow(0 18px 18px rgba(0,0,0,.25)); }
  .slot { position: absolute; width: 150px; height: 112px; display: flex; align-items: flex-end; justify-content: center; }
  .snack {
    position: absolute; bottom: 0; left: 50%;
    width: 86px; transform: translateX(-50%);
    cursor: grab; pointer-events: auto;
    transition: transform .2s cubic-bezier(.3,1.6,.5,1), filter .2s;
    filter: drop-shadow(0 6px 4px rgba(0,0,0,.35));
  }
  .snack img { width: 100%; }
  .snack:hover { transform: translateX(-50%) translateY(-10px) rotate(-3deg) scale(1.06); }
  .snack.gone { visibility: hidden; }
  .price-tag {
    position: absolute; left: 50%; bottom: -17px; transform: translateX(-50%);
    background: #ffe46b; color: #5b3a00; font-weight: 800; font-size: 15px;
    padding: 1px 10px; border-radius: 4px; white-space: nowrap;
    box-shadow: 0 2px 0 rgba(0,0,0,.25);
    z-index: 2;
  }

  /* 购物车 */
  #cart {
    position: absolute; left: 700px; top: 470px; width: 350px; height: 372px;
    cursor: pointer;
    transition: left .9s cubic-bezier(.5,0,.3,1);
  }
  #cart > img.cart-img { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 18px 10px rgba(0,0,0,.25)); z-index: 2; }
  #cart-items {
    position: absolute; left: 70px; top: 0px; width: 230px; height: 170px;
    z-index: 1;
  }
  #cart-items .in-cart {
    position: absolute; width: 74px;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.3));
    transition: transform .3s;
  }
  #cart.hot > img.cart-img { filter: drop-shadow(0 0 22px rgba(232,106,124,.9)); }
  #cart.bump { animation: bump .45s; }
  @keyframes bump {
    0% { transform: rotate(0); } 30% { transform: rotate(-3deg) translateY(4px); }
    60% { transform: rotate(2deg); } 100% { transform: rotate(0); }
  }
  #cart-count {
    position: absolute; right: 22px; top: 80px; z-index: 3;
    min-width: 44px; height: 44px; border-radius: 22px; padding: 0 10px;
    background: var(--accent); color: #fff; font-weight: 800; font-size: 22px;
    display: grid; place-items: center; box-shadow: 0 3px 0 #b84456;
    transform: scale(0); transition: transform .3s cubic-bezier(.3,1.8,.5,1);
  }
  #cart-count.show { transform: scale(1); }

  /* 收银台 + 店员 */
  #clerk { position: absolute; left: 1290px; top: 250px; width: 175px; height: 632px; transition: transform .3s; }
  #clerk img { width: 100%; height: 100%; }
  #clerk.wave { animation: sway 1s ease-in-out 2; }
  @keyframes sway { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
  #counter { position: absolute; left: 1080px; top: 470px; width: 520px; height: 426px; cursor: pointer; }
  #counter img { width: 100%; height: 100%; filter: drop-shadow(0 18px 14px rgba(0,0,0,.25)); }
  #counter.hot img { filter: drop-shadow(0 0 22px rgba(255,214,90,.95)); }

  .bubble {
    position: absolute; left: 1110px; top: 140px; width: 340px;
    background: var(--paper); border-radius: 22px; padding: 16px 20px;
    font-size: 21px; line-height: 1.45; font-weight: 600;
    box-shadow: 0 8px 20px rgba(0,0,0,.15);
    transition: opacity .25s, transform .25s;
  }
  .bubble::after {
    content: ""; position: absolute; right: 70px; bottom: -16px;
    border: 10px solid transparent; border-top: 16px solid var(--paper);
  }
  .bubble.pop { animation: pop .35s; }
  @keyframes pop { 0% { transform: scale(.85); opacity: .3; } 100% { transform: scale(1); opacity: 1; } }

  /* 收银台上的商品与扫描数字 */
  #scan-area { position: absolute; left: 1095px; top: 520px; width: 230px; height: 70px; z-index: 5; }
  .scan-item { position: absolute; width: 70px; transition: transform .45s, opacity .45s; }
  #screen {
    position: absolute; left: 1382px; top: 498px; width: 80px; height: 34px;
    background: #12261b; color: #6dff9a; border-radius: 4px;
    font: 700 16px/34px ui-monospace, Menlo, monospace; text-align: center;
    opacity: 0; transition: opacity .3s; z-index: 6;
  }
  #screen.on { opacity: 1; }

  /* 纸袋 */
  #bag {
    position: absolute; left: 1110px; top: 395px; width: 170px; z-index: 7;
    transform: translateY(40px) scale(.2); opacity: 0;
    transition: transform .6s cubic-bezier(.3,1.5,.5,1), opacity .3s;
  }
  #bag.show { transform: none; opacity: 1; }
  #bag img.bag-img { width: 100%; filter: drop-shadow(0 12px 10px rgba(0,0,0,.25)); }
  #bag .bag-logo {
    position: absolute; left: 0; right: 0; top: 52%; text-align: center;
    color: var(--accent); font-weight: 800; font-size: 19px; letter-spacing: 2px;
  }

  /* 拖拽中的幽灵 + 飞行动画 */
  .ghost {
    position: absolute; width: 120px; z-index: 50; pointer-events: none;
    filter: drop-shadow(0 16px 10px rgba(0,0,0,.35));
    transform: rotate(-6deg) scale(1.08);
  }
  .flyer { position: absolute; z-index: 40; pointer-events: none; will-change: transform; }

  /* HUD */
  #hud {
    position: absolute; left: 24px; bottom: 22px; z-index: 20;
    display: flex; gap: 12px; align-items: center;
  }
  .chip {
    background: var(--paper); border-radius: 999px; padding: 10px 20px;
    font-weight: 800; font-size: 20px; box-shadow: 0 4px 0 rgba(0,0,0,.18);
  }
  .btn {
    border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 20px;
    padding: 12px 26px; border-radius: 999px;
    background: var(--accent); color: #fff; box-shadow: 0 5px 0 #b84456;
    transition: transform .1s, opacity .2s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b84456; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.ghost-btn { background: var(--paper); color: var(--ink); box-shadow: 0 5px 0 rgba(0,0,0,.18); }

  .hint {
    position: absolute; left: 900px; top: 196px; transform: translateX(-50%);
    font-size: 19px; color: #8a6a55; font-weight: 600;
  }

  /* 小票 */
  #receipt-wrap {
    position: absolute; inset: 0; z-index: 60;
    background: rgba(40,25,18,.45);
    display: grid; place-items: center;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  #receipt-wrap.show { opacity: 1; pointer-events: auto; }
  #receipt {
    width: 380px; background: #fff; padding: 26px 28px 34px;
    font: 500 17px/1.6 ui-monospace, Menlo, "PingFang SC", monospace;
    transform: translateY(-40px); transition: transform .45s cubic-bezier(.3,1.4,.5,1);
    --zig: 12px;
    clip-path: polygon(0 0,100% 0,100% calc(100% - var(--zig)),95% 100%,90% calc(100% - var(--zig)),85% 100%,80% calc(100% - var(--zig)),75% 100%,70% calc(100% - var(--zig)),65% 100%,60% calc(100% - var(--zig)),55% 100%,50% calc(100% - var(--zig)),45% 100%,40% calc(100% - var(--zig)),35% 100%,30% calc(100% - var(--zig)),25% 100%,20% calc(100% - var(--zig)),15% 100%,10% calc(100% - var(--zig)),5% 100%,0 calc(100% - var(--zig)));
  }
  #receipt-wrap.show #receipt { transform: none; }
  #receipt h2 { margin: 0 0 4px; text-align: center; font-size: 24px; letter-spacing: 4px; }
  #receipt .sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 12px; }
  #receipt .row { display: flex; justify-content: space-between; gap: 12px; }
  #receipt .row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #receipt hr { border: 0; border-top: 2px dashed #ccc; margin: 10px 0; }
  #receipt .total { font-weight: 800; font-size: 22px; }
  #receipt .thanks { text-align: center; margin: 14px 0 16px; color: var(--accent); font-weight: 800; }
  #receipt .btn { display: block; margin: 0 auto; }

  /* 竖屏提示 */
  #rotate { display: none; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div class="wall-stripe"></div>
    <div class="sign">零食小铺</div>
    <div class="hint" id="hint">把零食拖进购物车，或者直接点一下 🛒</div>
    <div class="floor-tiles"></div>
    <div class="floor-line"></div>

    <div id="shelf"><img class="shelf-img" src="assets/shelf.webp" alt="货架"></div>

    <div id="clerk"><img src="assets/clerk.webp" alt="店员"></div>
    <div class="bubble" id="bubble">欢迎光临～<br>今天想吃点什么？</div>
    <div id="counter" title="去结账"><img src="assets/counter.webp" alt="收银台"></div>
    <div id="screen">¥0</div>
    <div id="scan-area"></div>
    <div id="bag"><img class="bag-img" src="assets/bag.webp" alt="纸袋"><div class="bag-logo">零食小铺</div></div>

    <div id="cart" title="点我看看车里有什么">
      <div id="cart-items"></div>
      <img class="cart-img" src="assets/cart.webp" alt="购物车">
      <div id="cart-count">0</div>
    </div>

    <div id="hud">
      <div class="chip" id="total">合计 ¥0.0</div>
      <button class="btn ghost-btn" id="undo" disabled>拿出最后一件</button>
      <button class="btn" id="checkout" disabled>去结账 →</button>
    </div>

    <div id="receipt-wrap">
      <div id="receipt">
        <h2>零食小铺</h2>
        <div class="sub" id="r-time"></div>
        <div id="r-rows"></div>
        <hr>
        <div class="row total"><span>合计</span><span id="r-total"></span></div>
        <div class="thanks">谢谢惠顾，欢迎再来！</div>
        <button class="btn" id="again">再逛一次</button>
      </div>
    </div>
  </div>
</div>

<script>
const SNACKS = [
  { id: 1, name: "爆米花 芝士味", price: 8.5 },
  { id: 2, name: "乐事 黄瓜味",   price: 7.0 },
  { id: 3, name: "好丽友 乌龟玉米片", price: 9.9 },
  { id: 4, name: "辣味鲜虾条",     price: 6.5 },
  { id: 5, name: "KAKA 鱼酥条",    price: 12.0 },
  { id: 6, name: "农心 蜂蜜麻花",  price: 8.0 },
  { id: 7, name: "上好佳 鲜虾片",  price: 5.5 },
  { id: 8, name: "辣味拉面丸子",   price: 6.0 },
  { id: 9, name: "呀！土豆",       price: 7.5 },
];

// 货架三层隔板的位置（相对货架图片的百分比），每层摆 3 件
const ROWS = [37.3, 55.6, 74.2];
const COLS = [22, 50, 78];

const $ = s => document.querySelector(s);
const stage = $("#stage"), shelf = $("#shelf"), cart = $("#cart"), counter = $("#counter");
const cartItems = $("#cart-items"), countEl = $("#cart-count"), totalEl = $("#total");
const checkoutBtn = $("#checkout"), undoBtn = $("#undo"), bubble = $("#bubble"), hint = $("#hint");

let scale = 1;
let basket = [];          // 购物车中的商品 id，按放入顺序
let busy = false;         // 结账动画进行中

/* ---------- 舞台缩放 ---------- */
function fit() {
  scale = Math.min(innerWidth / 1600, innerHeight / 900) * 0.98;
  stage.style.transform = `scale(${scale})`;
}
addEventListener("resize", fit); fit();

/* 将页面坐标换算到舞台坐标 */
function toStage(x, y) {
  const r = stage.getBoundingClientRect();
  return { x: (x - r.left) / scale, y: (y - r.top) / scale };
}
function rectInStage(el) {
  const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
  return { x: (r.left - s.left) / scale, y: (r.top - s.top) / scale, w: r.width / scale, h: r.height / scale };
}

/* ---------- 小音效 ---------- */
let actx;
function beep(freq = 880, dur = 0.08, type = "square", vol = 0.05) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
const plop = () => { beep(520, .07, "sine", .12); setTimeout(() => beep(780, .09, "sine", .1), 60); };

/* ---------- 店员说话 ---------- */
let sayTimer;
function say(text, ms) {
  bubble.innerHTML = text;
  bubble.classList.remove("pop"); void bubble.offsetWidth; bubble.classList.add("pop");
  clearTimeout(sayTimer);
  if (ms) sayTimer = setTimeout(() => say(idleLine()), ms);
}
function idleLine() {
  if (!basket.length) return "欢迎光临～<br>今天想吃点什么？";
  if (basket.length < 3) return "还要再看看吗？<br>好吃的都在货架上哦";
  return "选好了就来<br>收银台结账吧～";
}

/* ---------- 货架上的零食 ---------- */
function buildShelf() {
  shelf.querySelectorAll(".slot").forEach(n => n.remove());
  SNACKS.forEach((s, i) => {
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.style.zIndex = 3 - Math.floor(i / 3);
    slot.style.left = `calc(${COLS[i % 3]}% - 75px)`;
    slot.style.top = `calc(${ROWS[Math.floor(i / 3)]}% - 116px)`;
    slot.innerHTML = `
      <div class="snack" data-id="${s.id}">
        <img src="assets/snack${s.id}.webp" alt="${s.name}">
        <div class="price-tag">¥${s.price.toFixed(1)}</div>
      </div>`;
    shelf.appendChild(slot);
  });
}

/* ---------- 拖拽 / 点击 ---------- */
let drag = null;
stage.addEventListener("pointerdown", e => {
  const el = e.target.closest(".snack");
  if (!el || busy || el.classList.contains("gone")) return;
  e.preventDefault();
  const p = toStage(e.clientX, e.clientY);
  drag = { el, id: +el.dataset.id, start: p, moved: false, ghost: null };
  stage.setPointerCapture?.(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  const p = toStage(e.clientX, e.clientY);
  if (!drag.moved && Math.hypot(p.x - drag.start.x, p.y - drag.start.y) > 6) {
    drag.moved = true;
    drag.ghost = document.createElement("img");
    drag.ghost.className = "ghost";
    drag.ghost.src = `assets/snack${drag.id}.webp`;
    stage.appendChild(drag.ghost);
    drag.el.classList.add("gone");
  }
  if (drag.moved) {
    drag.ghost.style.left = p.x - 60 + "px";
    drag.ghost.style.top = p.y - 70 + "px";
    cart.classList.toggle("hot", overCart(p));
  }
});
stage.addEventListener("pointerup", e => {
  if (!drag) return;
  const d = drag; drag = null;
  cart.classList.remove("hot");
  const p = toStage(e.clientX, e.clientY);
  if (!d.moved) {                       // 单击：直接飞进购物车
    flyToCart(d.el, d.id);
    return;
  }
  const from = rectInStage(d.ghost);
  d.ghost.remove();
  if (overCart(p)) {
    addToCart(d.id, from);
  } else {                              // 没放进车里，弹回货架
    flyBack(d.el, d.id, from);
  }
});
stage.addEventListener("pointercancel", () => {
  if (!drag) return;
  drag.ghost?.remove(); drag.el.classList.remove("gone"); drag = null;
  cart.classList.remove("hot");
});

function overCart(p) {
  const r = rectInStage(cart);
  return p.x > r.x - 30 && p.x < r.x + r.w + 30 && p.y > r.y - 80 && p.y < r.y + r.h;
}

/* 用 Web Animations 沿抛物线飞行 */
function fly(src, from, to, { dur = 600, arc = 140, rot = 20, endScale = 1 } = {}) {
  const img = document.createElement("img");
  img.className = "flyer"; img.src = src;
  img.style.left = from.x + "px"; img.style.top = from.y + "px"; img.style.width = from.w + "px";
  stage.appendChild(img);
  const dx = to.x - from.x, dy = to.y - from.y;
  const frames = [];
  for (let i = 0; i <= 12; i++) {
    const t = i / 12;
    const x = dx * t, y = dy * t - arc * 4 * t * (1 - t);
    const s = 1 + (endScale - 1) * t;
    frames.push({ transform: `translate(${x}px, ${y}px) rotate(${rot * t}deg) scale(${s})` });
  }
  const a = img.animate(frames, { duration: dur, easing: "cubic-bezier(.4,0,.6,1)", fill: "forwards" });
  return a.finished.then(() => img);
}

function flyToCart(el, id) {
  const from = rectInStage(el.querySelector("img"));
  el.classList.add("gone");
  addToCart(id, from);
}
function flyBack(el, id, from) {
  const to = rectInStage(el.querySelector("img"));
  fly(`assets/snack${id}.webp`, from, to, { dur: 380, arc: 40, rot: 0 }).then(img => {
    img.remove(); el.classList.remove("gone");
  });
  say("诶，掉了～<br>要放进购物车里哦", 1800);
}

function cartSlot(n) {
  // 车篮里一层层叠起来
  const col = n % 3, layer = Math.floor(n / 3);
  return { x: 6 + col * 70 + (layer % 2) * 30, y: 70 - layer * 26, rot: (n * 37 % 30) - 15 };
}

function addToCart(id, from) {
  const slot = cartSlot(basket.length);
  basket.push(id);
  const cr = rectInStage(cartItems);
  const to = { x: cr.x + slot.x, y: cr.y + slot.y };
  updateHud();
  fly(`assets/snack${id}.webp`, from, to, { dur: 620, arc: 160, rot: slot.rot, endScale: 74 / from.w })
    .then(img => {
      img.remove();
      const it = document.createElement("img");
      it.className = "in-cart"; it.src = `assets/snack${id}.webp`; it.dataset.id = id;
      it.style.left = slot.x + "px"; it.style.top = slot.y + "px";
      it.style.transform = `rotate(${slot.rot}deg)`;
      cartItems.appendChild(it);
      cart.classList.remove("bump"); void cart.offsetWidth; cart.classList.add("bump");
      plop();
      const s = SNACKS.find(s => s.id === id);
      say(`${s.name}，好眼光！<br>¥${s.price.toFixed(1)}`, 2200);
    });
}

/* 拿出最后一件：放回货架 */
undoBtn.addEventListener("click", () => {
  if (busy || !basket.length) return;
  const id = basket.pop();
  const it = [...cartItems.children].reverse().find(n => +n.dataset.id === id);
  const el = shelf.querySelector(`.snack[data-id="${id}"]`);
  const from = rectInStage(it);
  it.remove();
  updateHud();
  const to = rectInStage(el.querySelector("img"));
  fly(`assets/snack${id}.webp`, { ...from, w: 74 }, to, { dur: 520, arc: 120, rot: -10, endScale: to.w / 74 })
    .then(img => { img.remove(); el.classList.remove("gone"); });
  say("好的，帮你放回去啦", 1600);
});

function sum(ids) { return ids.reduce((t, id) => t + SNACKS.find(s => s.id === id).price, 0); }

function updateHud() {
  const n = basket.length;
  countEl.textContent = n;
  countEl.classList.toggle("show", n > 0);
  totalEl.textContent = `合计 ¥${sum(basket).toFixed(1)}`;
  checkoutBtn.disabled = !n || busy;
  undoBtn.disabled = !n || busy;
  counter.classList.toggle("hot", n > 0 && !busy);
  hint.style.opacity = n ? 0 : 1;
}

/* 点购物车：店员报一下车里的东西 */
cart.addEventListener("click", e => {
  if (busy || drag) return;
  if (!basket.length) { say("购物车还是空的～<br>去货架上挑挑吧", 2000); return; }
  say(`车里有 ${basket.length} 件<br>一共 ¥${sum(basket).toFixed(1)}`, 2200);
});

/* ---------- 结账流程 ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
checkoutBtn.addEventListener("click", checkout);
counter.addEventListener("click", () => { if (basket.length && !busy) checkout(); });

async function checkout() {
  if (busy || !basket.length) return;
  busy = true; updateHud();
  const bought = basket.slice();
  $("#clerk").classList.add("wave");
  say("好的，马上帮你结账！");

  // 1. 推车到收银台旁边
  cart.style.left = "800px";
  await wait(950);

  // 2. 一件件拿到收银台扫描
  const screen = $("#screen"), area = $("#scan-area");
  screen.classList.add("on"); screen.textContent = "¥0";
  let running = 0;
  const items = [...cartItems.children];
  const ar = rectInStage(area);
  for (let i = 0; i < items.length; i++) {
    const it = items[i], id = +it.dataset.id;
    const from = rectInStage(it);
    it.remove();
    const to = { x: ar.x + 20 + (i % 4) * 40, y: ar.y - 10 - Math.floor(i / 4) * 12 };
    const img = await fly(`assets/snack${id}.webp`, { ...from, w: 74 }, to, { dur: 420, arc: 110, rot: 0, endScale: 70 / 74 });
    img.remove();
    const s = document.createElement("img");
    s.className = "scan-item"; s.src = `assets/snack${id}.webp`;
    s.style.left = to.x - ar.x + "px"; s.style.top = to.y - ar.y + "px";
    area.appendChild(s);
    running += SNACKS.find(x => x.id === id).price;
    screen.textContent = `¥${running.toFixed(1)}`;
    beep(1320, .09);
    await wait(120);
  }
  countEl.classList.remove("show");
  say(`一共 ¥${running.toFixed(1)}<br>帮你装袋～`);
  await wait(500);

  // 3. 纸袋出现，商品落进去
  const bag = $("#bag");
  bag.classList.add("show");
  await wait(500);
  const br = rectInStage(bag);
  for (const s of [...area.children]) {
    s.style.transform = `translate(${br.x + 60 - (rectInStage(s).x)}px, ${br.y + 60 - rectInStage(s).y}px) scale(.4)`;
    s.style.opacity = 0;
    beep(300, .05, "sine", .08);
    await wait(110);
  }
  await wait(400);
  area.innerHTML = "";
  bag.animate([{ transform: "translateY(0)" }, { transform: "translateY(-14px)" }, { transform: "translateY(0)" }], { duration: 380 });
  say("谢谢惠顾！<br>欢迎下次再来 ♡");
  await wait(700);

  // 4. 小票
  showReceipt(bought);
}

function showReceipt(ids) {
  const counts = {};
  ids.forEach(id => counts[id] = (counts[id] || 0) + 1);
  $("#r-rows").innerHTML = Object.entries(counts).map(([id, n]) => {
    const s = SNACKS.find(x => x.id === +id);
    return `<div class="row"><span>${s.name} ×${n}</span><span>¥${(s.price * n).toFixed(1)}</span></div>`;
  }).join("");
  $("#r-total").textContent = `¥${sum(ids).toFixed(1)}`;
  const d = new Date();
  $("#r-time").textContent = `${d.toLocaleDateString("zh-CN")} ${d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })} · 共 ${ids.length} 件`;
  $("#receipt-wrap").classList.add("show");
  beep(660, .1, "triangle", .08); setTimeout(() => beep(990, .16, "triangle", .08), 110);
}

$("#again").addEventListener("click", reset);
function reset() {
  $("#receipt-wrap").classList.remove("show");
  $("#bag").classList.remove("show");
  $("#screen").classList.remove("on");
  $("#clerk").classList.remove("wave");
  cartItems.innerHTML = "";
  basket = [];
  busy = false;
  cart.style.left = "700px";
  buildShelf();
  updateHud();
  say(idleLine());
}

buildShelf();
updateHud();
</script>
</body>
</html>
